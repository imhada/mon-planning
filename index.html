<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>W.A.L.T.E.R</title>
  <meta name="apple-mobile-web-app-title" content="W.A.L.T.E.R">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
  /* W.A.L.T.E.R : sobre, façon iOS. Un seul accent (bleu), gris pour tout le reste, verre dépoli pour ce qui flotte. */
  :root{
    color-scheme:light dark;
    --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --label:#1D1D1F; --label2:#6E6E73; --label3:#AEAEB2;
    --sep:rgba(60,60,67,.13); --fill:#EBEBF0; --fill2:#F2F2F7;
    --thumb:#FFFFFF; --accent:#0071E3; --tint:rgba(0,113,227,.10); --tint2:rgba(0,113,227,.18);
    --ok:#248A3D; --ok-fill:#34C759; --warn:#B25000; --danger:#D70015;
    --glass:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.7); --glass-hi:inset 0 1px 0 rgba(255,255,255,.75);
    --scrim:rgba(0,0,0,.22); --sheet:rgba(255,255,255,.88);
    --shadow:0 1px 2px rgba(0,0,0,.03),0 6px 24px rgba(0,0,0,.04);
    --shadow-float:0 8px 32px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;
    --r:22px; --r-s:12px; --side:232px;
    --spring:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#000000; --card:#1C1C1E; --card2:#232325; --label:#F5F5F7; --label2:#A1A1A6; --label3:#636366;
    --sep:rgba(84,84,88,.5); --fill:#2C2C2E; --fill2:#1C1C1E;
    --thumb:#636366; --accent:#0A84FF; --tint:rgba(10,132,255,.16); --tint2:rgba(10,132,255,.26);
    --ok:#30D158; --ok-fill:#30D158; --warn:#FF9F0A; --danger:#FF453A;
    --glass:rgba(36,36,38,.62); --glass-line:rgba(255,255,255,.10); --glass-hi:inset 0 1px 0 rgba(255,255,255,.08);
    --scrim:rgba(0,0,0,.5); --sheet:rgba(30,30,32,.88);
    --shadow:none; --shadow-float:0 8px 32px rgba(0,0,0,.5);
  }}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--label)}
  body{font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
    padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(116px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  @media (min-width:900px){body{padding:40px 48px 64px calc(var(--side) + 48px)}}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  main{display:flex;flex-direction:column;gap:28px}
  main.narrow{max-width:720px;width:100%;margin:0 auto}
  h1,h2,h3,p{margin:0}
  h1{font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.1}
  h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:15px;color:var(--label2)}
  .foot{font-size:13px;color:var(--label2)}
  .label{font-size:13px;color:var(--label2)}
  .note{font-size:13px;color:var(--label2);max-width:60ch}
  .empty{font-size:15px;color:var(--label2);padding:4px 0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
  a{color:var(--accent)}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--tint2);outline-offset:2px}
  .deskonly{display:none!important}
  @media (min-width:900px){.deskonly{display:flex!important}.mobonly{display:none!important}}
  @media (prefers-reduced-motion:no-preference){
    button,.press{transition:transform .2s var(--spring),background-color .2s,opacity .2s}
    button:active{transform:scale(.97)}
  }

  /* En-tête */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .top-l{display:flex;flex-direction:column;gap:4px;min-width:0}
  .top-r{display:flex;align-items:center;gap:10px}
  .round{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label)}
  .round:hover{background:var(--sep)}
  .round.accent{background:var(--tint);color:var(--accent)}
  .dot{position:absolute;right:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--label3);box-shadow:0 0 0 2px var(--bg)}
  .dot.ok{background:var(--ok-fill)} .dot.local{background:var(--label3)}

  /* Surfaces */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
  .group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:0}
  .ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 10px}
  .section{display:flex;flex-direction:column;min-width:0}
  .textbtn{color:var(--accent);font-size:16px;font-weight:400;min-height:36px;padding:0 2px}
  .textbtn.grey{color:var(--label2)}

  /* Boutons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;background:var(--accent);color:#fff;font-size:17px;font-weight:600}
  .btn:hover{filter:brightness(1.06)}
  .btn.full{width:100%}
  .btn.plain{background:var(--fill);color:var(--label)}
  .btn.soft{background:var(--tint);color:var(--accent)}
  .btn.danger{background:var(--fill);color:var(--danger)}
  .btn.small{min-height:34px;padding:0 14px;font-size:15px}
  .chip{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;background:var(--tint);color:var(--accent);font-size:15px;font-weight:500}

  /* Contrôle segmenté */
  .seg,.pills{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;align-self:stretch}
  .pills{overflow-x:auto;scrollbar-width:none}
  .seg button,.pills button{flex:1;min-height:34px;border-radius:9px;font-size:14px;font-weight:500;color:var(--label);white-space:nowrap;padding:0 12px}
  .seg button[aria-pressed="true"],.pills button[aria-pressed="true"]{background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
  @media (min-width:900px){.seg,.pills{align-self:flex-start;min-width:360px}}

  /* Aujourd'hui */
  .accueil{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
  @media (min-width:900px){.accueil{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:32px}.accueil>.col{display:flex;flex-direction:column;gap:28px;min-width:0}}
  .accueil>.col{display:contents}
  @media (min-width:900px){.accueil>.col{display:flex}}
  .hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:6px}
  .hk{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ht{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
  .hs{font-size:15px;color:var(--label2)}
  .hnote{font-size:13px;color:var(--accent);margin-top:6px}
  .hnote.ok{color:var(--ok);display:flex;align-items:center;gap:6px}
  .hero .btn{margin-top:18px}

  .nut{display:flex;flex-direction:column;gap:18px}
  .jauge{display:flex;flex-direction:column;gap:8px}
  .jh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .jl{font-size:16px}
  .jv{font-size:15px;color:var(--label2);white-space:nowrap}
  .jv b{font-size:17px;font-weight:600;color:var(--label)}
  .jf{display:flex;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
  .jf .m{background:var(--accent)} .jf .p{background:var(--label3);opacity:.45}
  @media (prefers-reduced-motion:no-preference){.jf span{transition:width .6s var(--spring)}}
  .jm{font-size:13px;color:var(--label2)} .jm.warn{color:var(--warn)} .jm.ok{color:var(--ok)}

  /* Listes groupées */
  .rows{list-style:none;margin:0;padding:0}
  .r{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:52px;padding:10px 16px 10px 20px;width:100%;text-align:left}
  .r+.r::before{content:"";position:absolute;top:0;left:20px;right:0;height:.5px;background:var(--sep)}
  .r.t{grid-template-columns:52px minmax(0,1fr) auto}
  .r.t+.r.t::before{left:84px}
  .r .h{font-size:15px;color:var(--label2)}
  .r .n{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r .s{font-size:13px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r .v{font-size:16px;color:var(--label2);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .r .chev{color:var(--label3)}
  button.r:hover,.r.link:hover{background:var(--card2)}
  .r.muted .n{color:var(--label2)}
  .r.done .n{color:var(--label2)}
  .r.k-seance .n{font-weight:600}
  .r.now{min-height:0;padding-top:4px;padding-bottom:4px}
  .r.now::before{display:none}
  .r.now+.r::before{display:none}
  .r.now .h{color:var(--accent);font-weight:600;font-size:13px}
  .nowl{height:1.5px;background:var(--accent);border-radius:1px;position:relative}
  .nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .chk{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--label3);display:grid;place-items:center;color:transparent}
  .chk:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .chk.on{background:var(--accent);box-shadow:none;color:#fff}
  @media (prefers-reduced-motion:no-preference){.chk.on{animation:pop .35s var(--spring)}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}}
  .chk svg{width:15px;height:15px}

  /* Planning */
  .wknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wknav .c{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
  .wknav .c b{font-size:17px;font-weight:600}
  .navchev{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
  .navchev:hover{background:var(--tint)}
  .week{display:flex;flex-direction:column}
  .day{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px 12px 16px;min-height:64px}
  .day+.day::before{content:"";position:absolute;top:0;left:80px;right:0;height:.5px;background:var(--sep)}
  .day .hit{position:absolute;inset:0;width:100%}
  .day .hit:hover{background:var(--card2)}
  .day.over{background:var(--tint)}
  .dn{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;position:relative}
  .dn small{font-size:12px;color:var(--label2)}
  .dn b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600}
  .day.today .dn b{background:var(--accent);color:#fff}
  .dinfo{display:flex;flex-direction:column;gap:2px;min-width:0;pointer-events:none;position:relative}
  .dinfo .n{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dinfo .n.repos{font-weight:400;color:var(--label2)}
  .dinfo .s{font-size:13px;color:var(--label2)}
  .dinfo .n.fait{color:var(--ok)}
  .day .chev{color:var(--label3);pointer-events:none;position:relative}
  .ev.s{position:relative;z-index:1}
  .meals{display:none}
  @media (min-width:900px){
    main.planning .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;background:none;box-shadow:none;overflow:visible}
    main.planning .day{display:flex;flex-direction:column;align-items:stretch;gap:12px;min-height:320px;padding:14px 12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
    main.planning .day::before{display:none}
    main.planning .day .hit{border-radius:18px}
    main.planning .dn{flex-direction:row;justify-content:space-between;align-items:center}
    main.planning .dn b{width:32px;height:32px;font-size:17px}
    main.planning .chev{display:none}
    main.planning .dinfo{gap:10px}
    main.planning .ev.s{display:block;width:100%;text-align:left;background:var(--tint);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;cursor:grab;pointer-events:auto}
    main.planning .ev.s.fait{background:var(--fill);color:var(--ok)}
    main.planning .ev.o{font-size:14px;color:var(--label2);padding:8px 2px}
    main.planning .dinfo .n,main.planning .dinfo>.s{display:none}
    main.planning .meals{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--label2)}
    main.planning .meals b{display:block;color:var(--label);font-weight:400;font-size:13px}
  }
  .ev.s,.ev.o{display:none}
  @media (min-width:900px){main.planning .ev.s,main.planning .ev.o{display:block}}

  /* Séances */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  @media (max-width:420px){.sgrid{grid-template-columns:minmax(0,1fr)}}
  .scard{padding:0;gap:0;overflow:hidden}
  .shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 8px}
  .sname{font-size:24px;font-weight:700;letter-spacing:-.02em;display:block}
  .sets{font-size:15px;color:var(--label2);white-space:nowrap}
  .r .s.up{color:var(--accent)}
  .sfoot{padding:12px 20px 20px}

  /* Cuisine */
  .search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;color:var(--label2)}
  .search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--label);padding:10px 0;min-width:0;outline:none}
  .search input::placeholder{color:var(--label2)}

  /* Courbe */
  .curve svg{width:100%;height:auto;max-height:200px;display:block;overflow:visible}

  /* Navigation : barre d'onglets en verre sur téléphone, barre latérale sur ordinateur */
  .nav{position:fixed;z-index:10;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    box-shadow:var(--shadow-float),var(--glass-hi);border:.5px solid var(--glass-line)}
  .nav .items{display:flex}
  .navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label2);font-size:11px;font-weight:500;border-radius:999px}
  .navbtn svg{width:24px;height:24px}
  .navbtn[aria-selected="true"]{color:var(--accent)}
  .brand{display:none}
  @media (max-width:899px){
    .nav{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:5px}
    .nav .items{justify-content:space-between;max-width:440px;margin:0 auto}
    .navbtn{flex:1;min-height:54px}
    .navbtn[aria-selected="true"]{background:var(--tint)}
  }
  @media (min-width:900px){
    .nav{top:0;bottom:0;left:0;width:var(--side);padding:40px 14px;border-width:0 .5px 0 0;border-radius:0;display:flex;flex-direction:column;gap:28px;box-shadow:none}
    .brand{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;padding:0 12px}
    .nav .items{flex-direction:column;gap:2px}
    .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;color:var(--label);min-height:40px;padding:0 12px;border-radius:10px}
    .navbtn svg{width:20px;height:20px;color:var(--accent)}
    .navbtn:hover{background:var(--fill)}
    .navbtn[aria-selected="true"]{background:var(--tint2);color:var(--label);font-weight:600}
  }

  /* Feuilles */
  .sheet-bg{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
  .sheet{position:relative;background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
    width:100%;max-width:560px;border-radius:28px 28px 0 0;box-shadow:var(--shadow-float),var(--glass-hi);
    padding:26px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
    display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto}
  .sheet>h2{font-size:22px}
  .sheet:not(.full)::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3);opacity:.6}
  @media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:28px}.sheet:not(.full)::before{display:none}}
  @media (prefers-reduced-motion:no-preference){
    .sheet-bg{animation:fondu .3s ease-out}
    .sheet{animation:monte .55s var(--spring)}
    @media (min-width:640px){.sheet{animation:apparait .4s var(--spring)}}
    @keyframes fondu{from{background:transparent}}
    @keyframes monte{from{transform:translateY(100%)}}
    @keyframes apparait{from{transform:scale(.94);opacity:0}}
  }
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field>.label{padding-left:4px}
  .field input,.field select,.in{font:inherit;font-size:17px;color:var(--label);padding:12px 14px;border-radius:12px;border:0;background:var(--fill);width:100%;min-width:0}
  .field input.bigin{font-size:28px;font-weight:600}
  .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .actions-row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .sheet>.actions-row{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:4px calc(-1 * max(20px,env(safe-area-inset-left,0px))) calc(-20px - env(safe-area-inset-bottom,0px));
    padding:12px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-top:.5px solid var(--sep)}
  .sheet .actions-row .btn{min-height:46px;font-size:16px}
  .lrow{display:grid;gap:8px;align-items:center}
  .lrow.repas{grid-template-columns:112px minmax(0,1fr) 40px}
  .lrow.exo{grid-template-columns:minmax(0,1fr) 64px 64px 40px}
  .lrow .x{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--label2)}
  .lrow .x:hover{color:var(--danger)}
  .lhead{font-size:12px;color:var(--label2)}
  .add{color:var(--accent);font-size:16px;text-align:left;min-height:40px;padding:0 4px}
  .login{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px;padding:28px}
  .linkbtn{color:var(--accent);font-size:15px;align-self:center;min-height:36px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .pill.ok{color:var(--ok)}
  .info{font-size:13px;color:var(--label2);text-align:center}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font-size:16px}
  .kv+.kv{box-shadow:inset 0 .5px 0 var(--sep)}
  .kv .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* Mode séance */
  .sheet.full{padding:0;gap:0;max-width:640px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  @media (max-width:639px){.sheet-bg.full{align-items:stretch}.sheet.full{height:100dvh;max-height:none;border-radius:0}}
  @media (min-width:640px){.sheet.full{height:92vh;max-height:92vh}}

/* ---------- Journées : la semaine type remplit, un jour modifié devient le sien ---------- */
function jour(d){
  if(S.jours[d])return S.jours[d];

  return {seance:t.seance?{...t.seance}:null,seanceFaite:false,repas:(t.repas||[]).map(r=>({id:"",plat:r.plat,heure:r.heure,mange:false}))};
}
function fige(d){
  if(!S.jours[d]){const j=structuredClone(jour(d));j.repas.forEach(r=>r.id=uid());S.jours[d]=j}
  return S.jours[d];
}
const repasTries=j=>j.repas.map((r,i)=>({...r,i})).sort((a,b)=>mins(a.heure)-mins(b.heure));
function totaux(d){
  const j=jour(d);let prot=0,kcal=0,protP=0,kcalP=0;
  j.repas.forEach(r=>{const p=platOf(r.plat);if(!p)return;protP+=+p.prot||0;kcalP+=+p.kcal||0;if(r.mange){prot+=+p.prot||0;kcal+=+p.kcal||0}});
  return {prot,kcal,protP,kcalP};
}
function coucher(){const p=S.profil;return hhmm(mins(p.lever)-(+p.sommeil||8)*60)}
function dernierPoids(){return [...S.poids].sort((a,b)=>a.date<b.date?-1:1).pop()}
function cibles(){
  const p=S.profil, kg=dernierPoids()?.kg;
  return {prot:+p.prot||(kg?Math.round(kg*1.8):0), kcal:+p.kcal||0, auto:!(+p.prot)&&!!kg};
}

/* ---------- Progression des charges ---------- */
function dernierLog(exoId){
  for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].exos.find(x=>x.exoId===exoId&&x.sets.some(s=>+s.kg>0||+s.reps>0));if(e)return {date:S.logs[i].date,sets:e.sets}}
  return null;
}
function conseil(exo){
  const l=dernierLog(exo.id); if(!l)return null;
  const faits=l.sets.filter(s=>+s.reps>0), kg=Math.max(0,...faits.map(s=>+s.kg||0));
  const reussi=faits.length>=exo.series&&faits.every(s=>+s.reps>=exo.reps);
  return {kg, reps:faits.length?Math.min(...faits.map(s=>+s.reps)):0, plus:reussi&&kg>0, prochain:reussi&&kg>0?kg+2.5:kg, date:l.date};
}
function record(exoId){let m=0;S.logs.forEach(l=>l.exos.forEach(e=>{if(e.exoId===exoId)e.sets.forEach(s=>{if(+s.reps>0)m=Math.max(m,+s.kg||0)})}));return m}

/* ---------- Stockage : Supabase protégé par un code ---------- */
// Le code n'est pas dans ce fichier. Supabase n'en garde qu'une empreinte (bcrypt) et bloque 15 min après 5 codes faux.
function setSync(m,t){$("dot").className="dot "+(m==="db"?"ok":"local");$("synctxt").textContent=t}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r)S={...DEFAULT,...JSON.parse(r)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
const hasData=()=>S.seances.length||S.plats.length;
const MSG={code:"Code incorrect.",bloque:"Trop d'essais : accès bloqué 15 minutes."};
function oublierCode(){try{localStorage.removeItem("walter-code")}catch(e){}code=null}
function save(){
  rev++; saveLocal();
  if(!sb||!code)return;
  clearTimeout(saveT);pending=true;setSync("db","Enregistrement…");

    try{
      const {data,error}=await sb.rpc("save_walter",{c:code,d:S});

      setSync("db","Synchronisé");
      try{canal?.send({type:"broadcast",event:"maj",payload:{de:APPAREIL}})}catch(e){}
    }catch(e){setSync("local","Non synchronisé, réessaie plus tard")}
    pending=false;
  },500);
}
async function loadRemote(silencieux){
  if(!sb||!code||pending)return null;
  if(document.querySelector(".sheet-bg")){differe=true;return null}
  if(!silencieux)setSync("db","Chargement…");
  const r0=rev, local=S;
  const {data,error}=await sb.rpc("get_walter",{c:code});
  if(error){setSync("local","Erreur de synchro");return null}
  if(rev!==r0||pending)return null; // modifié pendant le chargement : on garde la version locale, elle part à l'enregistrement
  if(data&&data._erreur){
    if(data._erreur==="code")oublierCode();
    pinMsg=MSG[data._erreur]||"Accès refusé.";render();setSync("local",pinMsg);return data._erreur;
  }
  pinMsg="";
  S={...DEFAULT,...data};
  if(!hasData()){S=(local.seances.length||local.plats.length)?local:structuredClone(SEED);save()}
  saveLocal();render();setSync("db","Synchronisé");return "ok";
}
function reprendre(){
  try{const b=JSON.parse(localStorage.getItem("walter-seance-en-cours")||"null");

function vLogin(){

}
function wireLogin(){

// Une ligne de nutrition : bleu = mangé, gris = prévu dans la journée, la barre entière = l'objectif
function jauge(label,mange,prevu,cible,unite){
  const max=Math.max(cible||0,prevu,1), pM=Math.min(mange,max)/max*100, pP=Math.max(0,Math.min(prevu,max)-mange)/max*100;
  let msg="",cls="";
  if(!cible){msg="Fixe ton objectif dans les réglages."}
  else if(mange>=cible){msg="Objectif atteint.";cls="ok"}
  else if(prevu<cible){msg=`Il manque ${fmt(cible-prevu)} ${unite} dans tes repas prévus.`;cls="warn"}
  return `<div class="jauge"><div class="jh"><span class="jl">${label}</span><span class="jv"><b>${fmt(mange)}</b>${cible?` sur ${fmt(cible)}`:""} ${unite}</span></div>
    <div class="jf" role="img" aria-label="${label} : ${fmt(mange)} ${unite} mangés, ${fmt(prevu)} prévus${cible?`, objectif ${fmt(cible)}`:""}"><span class="m" style="width:${pM}%"></span><span class="p" style="width:${pP}%"></span></div>
    ${msg?`<p class="jm ${cls}">${msg}</p>`:""}</div>`;
}

function courbePoids(){
  const pts=[...S.poids].sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2)return `<p class="empty">${pts.length?"Encore une pesée et la courbe apparaît.":"Note ton poids quand tu y penses, la courbe se construit toute seule."}</p>`;
  const W=600,H=170,P={l:8,r:60,t:16,b:24}, obj=+S.profil.objectif||80;
  const ks=pts.map(p=>p.kg), mn=Math.min(...ks,obj)-1, mx=Math.max(...ks,obj)+1;
  const t0=parse(pts[0].date).getTime(), t1=parse(pts[pts.length-1].date).getTime()||t0+1;
  const X=d=>P.l+(parse(d).getTime()-t0)/Math.max(1,t1-t0)*(W-P.l-P.r), Y=v=>H-P.b-(v-mn)/(mx-mn)*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.date).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
  const last=pts[pts.length-1], dl=d=>parse(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  return `<div class="curve"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids, dernier ${num(last.kg)} kg, objectif ${num(obj)} kg">
    <line x1="${P.l}" x2="${W-P.r}" y1="${Y(obj)}" y2="${Y(obj)}" style="stroke:var(--label3)" stroke-dasharray="3 5"/><text x="${W-P.r+8}" y="${Y(obj)+4}" font-size="12" style="fill:var(--label2)">${num(obj)} kg</text>
    <path d="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.date)}" cy="${Y(last.kg)}" r="4.5" style="fill:var(--accent)"/>
    <text x="${X(last.date)+8}" y="${Y(last.kg)+4}" font-size="13" font-weight="600" style="fill:var(--label)">${num(last.kg)} kg</text>
    <text x="${P.l}" y="${H-4}" font-size="12" style="fill:var(--label2)">${dl(pts[0].date)}</text>
    <text x="${W-P.r}" y="${H-4}" font-size="12" style="fill:var(--label2)" text-anchor="end">${dl(last.date)}</text></svg></div>`;
}

function modal(inner,onOpen,collant,cls){

  document.body.appendChild(bg);
  const close=()=>{bg.remove();if(differe){differe=false;setTimeout(()=>loadRemote(true),600)}};
  if(!collant)bg.addEventListener("mousedown",e=>{if(e.target===bg)close()});
  bg.querySelector("form").addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  onOpen&&onOpen(bg.querySelector("form"),close);
  return {bg,close};
}
const footer=del=>`<p class="err" style="margin:0;color:var(--down);font-size:.88rem" hidden></p>

function wireFooter(f,close,onSave,onDel){

}
const optsSeances=()=>Object.fromEntries([["","Repos"],...S.seances.map(s=>[s.id,s.nom])]);
const optsPlats=sel=>S.plats.map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.nom)}</option>`).join("");

// Une journée (ou un jour de la semaine type) : séance et repas
function daySheet(key,isType){
  const src=isType?(S.type[key]||{seance:null,repas:[]}):jour(key);
  const draft={seance:src.seance?{...src.seance}:null,repas:(src.repas||[]).filter(r=>platOf(r.plat)).map(r=>({...r}))};
  draft.repas.sort((a,b)=>mins(a.heure)-mins(b.heure));
  const titre=isType?`Chaque ${DOW_LONG[key]}`:longDate(key).replace(/^./,c=>c.toUpperCase());
  modal(`<h2 style="font-size:1.2rem">${esc(titre)}</h2>
    <div class="row2"><label class="field"><span class="label">Séance</span><select name="sea">${Object.entries(optsSeances()).map(([k,l])=>`<option value="${k}" ${k===(draft.seance?.id||"")?"selected":""}>${esc(l)}</option>`).join("")}</select></label>
    <label class="field"><span class="label">Heure</span><input name="seh" type="time" value="${esc(draft.seance?.heure||"18:30")}"></label></div>
    <div class="field"><span class="label">Repas</span><div id="rows" style="display:flex;flex-direction:column;gap:8px"></div><button type="button" class="add" id="addr">+ Ajouter un repas</button></div>
    ${isType?"":`<p class="note">Ce jour garde ses propres réglages, la semaine type ne le modifiera plus.</p>`}
    ${footer(false)}`,(f,close)=>{
    const rows=f.querySelector("#rows");
    const lire=()=>rows.querySelectorAll(".lrow").forEach((r,i)=>{draft.repas[i].heure=r.querySelector("input").value;draft.repas[i].plat=r.querySelector("select").value});
    const dessin=()=>{rows.innerHTML=draft.repas.length?draft.repas.map((r,i)=>`<div class="lrow repas"><input class="in" type="time" value="${esc(r.heure)}" aria-label="Heure du repas"><select class="in" aria-label="Plat">${optsPlats(r.plat)}</select><button type="button" class="x" data-i="${i}" aria-label="Retirer ce repas">${ICON.x}</button></div>`).join(""):`<p class="empty">Aucun repas prévu.</p>`;
      rows.querySelectorAll(".x").forEach(b=>b.onclick=()=>{lire();draft.repas.splice(+b.dataset.i,1);dessin()})};
    dessin();
    f.querySelector("#addr").onclick=()=>{if(!S.plats.length)return;lire();draft.repas.push({id:uid(),plat:S.plats[0].id,heure:"12:30",mange:false});dessin()};
    wireFooter(f,close,()=>{
      lire();const sid=f.elements.sea.value, sh=f.elements.seh.value||"18:30";
      const seance=sid?{id:sid,heure:sh}:null;
      if(isType){S.type[key]={seance,repas:draft.repas.map(r=>({plat:r.plat,heure:r.heure}))};return}
      const j=fige(key);if((j.seance?.id||"")!==sid)j.seanceFaite=false;
      j.seance=seance;j.repas=draft.repas.map(r=>({id:r.id||uid(),plat:r.plat,heure:r.heure,mange:!!r.mange}));
    });
  });
}
function moveSheet(d){
  const j=jour(d), s=j.seance&&seanceOf(j.seance.id); if(!s)return daySheet(d,false);
  const base=monday(d), opts=Object.fromEntries([0,1,2,3,4,5,6].map(i=>{const x=addD(base,i);return [x,longDate(x)+(x===d?" (actuel)":jour(x).seance&&seanceOf(jour(x).seance.id)?` (échange avec ${seanceOf(jour(x).seance.id).nom})`:"")]}));
  sheet(`Déplacer ${esc(s.nom)}`,[{name:"j",label:"Nouveau jour",type:"select",options:opts,value:d},{name:"h",label:"Heure",type:"time",value:j.seance.heure}],
    v=>{if(v.j===d){fige(d).seance.heure=v.h||j.seance.heure;return}deplacer(d,v.j,v.h)});
}
function seanceSheet(s){
  const nouveau=!s; s=s||{nom:"",muscles:"",duree:60,exos:[]};
  const draft=s.exos.map(e=>({...e}));
  modal(`<h2 style="font-size:1.2rem">${nouveau?"Nouvelle séance":"Modifier la séance"}</h2>
    <div class="row2"><label class="field"><span class="label">Nom</span><input name="nom" value="${esc(s.nom)}" placeholder="Push"></label>
    <label class="field"><span class="label">Durée (min)</span><input name="duree" type="number" inputmode="numeric" min="0" value="${+s.duree||60}"></label></div>
    <label class="field"><span class="label">Muscles travaillés</span><input name="mus" value="${esc(s.muscles)}" placeholder="Pecs, épaules, triceps"></label>
    <div class="field"><div class="lrow exo lhead"><span>Exercice</span><span>Séries</span><span>Reps</span><span></span></div><div id="rows" style="display:flex;flex-direction:column;gap:8px"></div><button type="button" class="add" id="addx">+ Ajouter un exercice</button></div>
    ${footer(!nouveau)}`,(f,close)=>{
    const rows=f.querySelector("#rows");
    const lire=()=>rows.querySelectorAll(".lrow").forEach((r,i)=>{const [n,se,re]=r.querySelectorAll("input");draft[i].nom=n.value.trim();draft[i].series=Math.max(1,parseInt(se.value)||1);draft[i].reps=Math.max(1,parseInt(re.value)||1)});
    const dessin=()=>{rows.innerHTML=draft.map((e,i)=>`<div class="lrow exo"><input class="in" value="${esc(e.nom)}" placeholder="Nom de l'exercice" aria-label="Exercice"><input class="in" type="number" inputmode="numeric" min="1" value="${e.series}" aria-label="Séries"><input class="in" type="number" inputmode="numeric" min="1" value="${e.reps}" aria-label="Répétitions"><button type="button" class="x" data-i="${i}" aria-label="Retirer cet exercice">${ICON.x}</button></div>`).join("")||`<p class="empty">Aucun exercice.</p>`;
      rows.querySelectorAll(".x").forEach(b=>b.onclick=()=>{lire();draft.splice(+b.dataset.i,1);dessin()})};
    dessin();
    f.querySelector("#addx").onclick=()=>{lire();draft.push({id:uid(),nom:"",series:3,reps:10});dessin();rows.querySelector(".lrow:last-child input")?.focus()};
    wireFooter(f,close,()=>{
      lire();const nom=f.elements.nom.value.trim();if(!nom)return "Donne un nom à la séance.";
      const v={nom,muscles:f.elements.mus.value.trim(),duree:parseInt(f.elements.duree.value)||60,exos:draft.filter(e=>e.nom)};
      if(nouveau)S.seances.push({id:uid(),...v});else Object.assign(s,v);
    },()=>{S.seances=S.seances.filter(x=>x!==s)});
    if(nouveau)setTimeout(()=>f.elements.nom.focus(),50);
  });
}
// Mode séance : une série validée d'un geste, minuteur de repos, saisie gardée sur l'appareil
let repos=null;
function stopRepos(){if(repos){clearInterval(repos.h);repos=null}}
function workout(sid,d){
  const s=seanceOf(sid);if(!s)return;
  const deja=S.logs.find(l=>l.date===d&&l.seanceId===sid);
  const KEY="walter-seance-en-cours";
  let brouillon=null;try{const b=JSON.parse(localStorage.getItem(KEY)||"null");if(b&&b.sid===sid&&b.d===d&&b.w===2)brouillon=b.v}catch(e){}
  const total=s.exos.reduce((a,e)=>a+(+e.series||0),0);
  modal(`<header class="whead"><div class="wtop"><button type="button" class="wclose" data-k="cancel">Fermer</button><span class="wcount"><b id="wdone">0</b> / ${total} séries</span></div>
      <b class="wt">${esc(s.nom)}</b><div class="wbar"><span id="wbar"></span></div></header>
    <div class="wbody">
    ${s.exos.map(e=>{const c=conseil(e), prev=deja?.exos.find(x=>x.exoId===e.id)?.sets||[];
      return `<section class="wex" data-exo="${e.id}"><div class="wexh"><b>${esc(e.nom)}</b><span class="sets">${e.series} × ${e.reps}</span></div>
      ${c?`<p class="wlast${c.plus?" up":""}">Dernière fois : ${charge(c.kg)} × ${c.reps}${c.plus?`. Tout réussi, vise ${num(c.prochain)} kg.`:""}</p>`:`<p class="wlast">Première fois : prends une charge que tu tiens sur ${e.reps} répétitions propres.</p>`}
      <div class="wcols" aria-hidden="true"><span></span><span>Charge (kg)</span><span>Répétitions</span><span></span></div>
      ${Array.from({length:e.series},(_,i)=>{const p=prev[i];const kg=p?(p.kg||""):(c&&c.prochain?c.prochain:"");const reps=p&&p.reps?p.reps:e.reps;const done=!!(p&&p.reps>0);
        return `<div class="wset${done?" done":""}"><span class="sn">${i+1}</span>
          <div class="step"><button type="button" data-d="-2.5" aria-label="Moins 2,5 kg">−</button><input class="in" type="number" inputmode="decimal" step="0.5" min="0" value="${kg}" placeholder="kg" aria-label="${esc(e.nom)}, série ${i+1}, charge en kg"><button type="button" data-d="2.5" aria-label="Plus 2,5 kg">+</button></div>
          <div class="step"><button type="button" data-d="-1" aria-label="Une répétition de moins">−</button><input class="in" type="number" inputmode="numeric" min="0" value="${reps}" aria-label="${esc(e.nom)}, série ${i+1}, répétitions"><button type="button" data-d="1" aria-label="Une répétition de plus">+</button></div>
          <button type="button" class="setok" aria-pressed="${done}" aria-label="Valider la série ${i+1} de ${esc(e.nom)}">${ICON.check}</button></div>`}).join("")}</section>`}).join("")}
    </div>
    <footer class="wfoot"><div class="rest" id="rest" hidden><span>Repos</span><b id="rt">1:30</b><button type="button" id="rplus">+30 s</button><button type="button" id="rskip">Passer</button></div>
      <p class="err" style="margin:0;color:var(--down);font-size:.88rem" hidden></p>
      <button class="btn xl" type="submit">Terminer la séance</button></footer>`,(f,close0)=>{
    const close=()=>{stopRepos();close0()};
    const rows=[...f.querySelectorAll(".wset")], rest=f.querySelector("#rest"), rt=f.querySelector("#rt");
    function setDone(r,on){r.classList.toggle("done",!!on);r.querySelector(".setok").setAttribute("aria-pressed",String(!!on))}
    function progress(){const n=rows.filter(r=>r.classList.contains("done")).length;f.querySelector("#wdone").textContent=n;f.querySelector("#wbar").style.width=(total?n/total*100:0)+"%";return n}
    const garder=()=>{try{localStorage.setItem(KEY,JSON.stringify({sid,d,w:2,v:rows.map(r=>{const[k,n]=r.querySelectorAll("input");return [k.value,n.value,r.classList.contains("done")]})}))}catch(e){}};
    const oublier=()=>{try{localStorage.removeItem(KEY)}catch(e){}};
    if(brouillon&&brouillon.length===rows.length)rows.forEach((r,i)=>{const[k,n]=r.querySelectorAll("input");k.value=brouillon[i][0];n.value=brouillon[i][1];setDone(r,brouillon[i][2])});
    progress();
    function lancerRepos(sec){
      stopRepos();let fin=Date.now()+sec*1000;rest.hidden=false;rest.classList.remove("fini");
      const tick=()=>{const r=Math.max(0,Math.round((fin-Date.now())/1000));rt.textContent=Math.floor(r/60)+":"+pad(r%60);
        if(r<=0){stopRepos();rest.classList.add("fini");rt.textContent="Série suivante";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}};
      repos={h:setInterval(tick,250),add:x=>{fin+=x*1000;tick()}};tick();
    }
    f.querySelector("#rplus").onclick=()=>{if(repos)repos.add(30);else lancerRepos(30)};
    f.querySelector("#rskip").onclick=()=>{stopRepos();rest.hidden=true};
    f.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.d){const inp=b.parentElement.querySelector("input");const v=(parseFloat(String(inp.value).replace(",","."))||0)+(+b.dataset.d);inp.value=Math.max(0,Math.round(v*10)/10);garder();return}
      if(b.classList.contains("setok")){const r=b.closest(".wset"),on=!r.classList.contains("done");setDone(r,on);
        if(on){const kg=r.querySelector("input").value;let x=r.nextElementSibling;while(x&&x.classList.contains("wset")){const k=x.querySelector("input");if(!k.value&&!x.classList.contains("done"))k.value=kg;x=x.nextElementSibling}}
        const n=progress();garder();
        if(on&&n<total){lancerRepos(90);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}}
    });
    f.addEventListener("input",garder);
    let arme=false;const fermer=f.querySelector('[data-k="cancel"]');
    fermer.onclick=()=>{if(!progress()){oublier();close();return}if(!arme){arme=true;fermer.textContent="Abandonner la saisie ?";return}oublier();close()};
    f.onsubmit=e=>{e.preventDefault();
      const exos=[...f.querySelectorAll(".wex")].map(w=>({exoId:w.dataset.exo,nom:seanceOf(sid).exos.find(x=>x.id===w.dataset.exo)?.nom||"",sets:[...w.querySelectorAll(".wset")].map(r=>{const[k,n]=r.querySelectorAll("input");const ok=r.classList.contains("done");return {kg:parseFloat(String(k.value).replace(",","."))||0,reps:ok?(parseInt(n.value)||0):0}})}));
      if(!exos.some(x=>x.sets.some(st=>st.reps>0))){const p=f.querySelector(".err");p.textContent="Valide au moins une série avec le bouton coché pour enregistrer la séance.";p.hidden=false;return}
      S.logs=S.logs.filter(l=>!(l.date===d&&l.seanceId===sid));
      S.logs.push({id:uid(),date:d,seanceId:sid,exos});S.logs.sort((a,b)=>a.date<b.date?-1:1);
      const j=fige(d);
      if(!j.seance||j.seance.id!==sid){
        if(j.seance&&seanceOf(j.seance.id)&&!j.seanceFaite){ // la séance prévue part au prochain jour de repos
          for(let k=1;k<=7;k++){const dd=addD(d,k),jj=jour(dd);if(!jj.seance||!seanceOf(jj.seance.id)){fige(dd).seance={...j.seance};break}}
        }
        j.seance={id:sid,heure:hhmm(nowMin())};
      }
      j.seanceFaite=true;oublier();
      save();render();close();toast(`Séance ${s.nom} enregistrée`)};
  },true,"full");
}
function toast(msg){
  let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2400);
}
function heureParDefaut(type){const h=new Date().getHours();return type==="repas"?(h>=14?"20:00":"12:30"):(HEURE_TYPE[type]||"12:30")}
function reglages(){
  const p=S.profil, kg=dernierPoids()?.kg;
  const repere=kg?`Repère prise de muscle : 1,6 à 2,2 g de protéines par kg et par jour (ISSN, 2017), soit ${Math.round(kg*1.6)} à ${Math.round(kg*2.2)} g pour tes ${num(kg)} kg. Vide = 1,8 g/kg automatiquement.`:"Repère prise de muscle : 1,6 à 2,2 g de protéines par kg et par jour (ISSN, 2017). Note ton poids pour que Walter le calcule.";
  sheet("Réglages",[
    {type:"html",html:`<div class="row2"><label class="field"><span class="label">Heure de lever</span><input name="lever" type="time" value="${esc(p.lever)}"></label><label class="field"><span class="label">Heures de sommeil</span><input name="sommeil" type="number" inputmode="decimal" step="0.5" min="4" value="${p.sommeil}"></label></div>
      <div class="row2"><label class="field"><span class="label">Protéines par jour (g)</span><input name="prot" type="number" inputmode="numeric" min="0" value="${+p.prot||""}" placeholder="auto"></label><label class="field"><span class="label">Calories par jour (kcal)</span><input name="kcal" type="number" inputmode="numeric" min="0" value="${+p.kcal||""}" placeholder="à définir"></label></div>
      <p class="note">${repere}</p>
      <label class="field"><span class="label">Objectif de poids (kg)</span><input name="objectif" type="number" inputmode="decimal" step="0.5" min="0" value="${p.objectif}"></label>
      <div style="box-shadow:inset 0 1px 0 var(--rail);padding-top:12px;display:flex;flex-direction:column;gap:8px">
        <span class="label">Synchronisation : ${esc($("synctxt").textContent)}</span>
        <div class="acts">${code?`<button type="button" class="btn danger" id="lock">Verrouiller cet appareil</button>`:sb?`<button type="button" class="btn soft" id="unlock">Entrer mon code</button>`:""}<button type="button" class="btn plain" id="reset">Tout remettre à zéro</button></div></div>`}],
    ()=>{const f=document.querySelector(".sheet");const g=n=>parseFloat(String(f.querySelector(`[name="${n}"]`).value).replace(",","."));
      p.lever=f.querySelector('[name="lever"]').value||"07:00";p.sommeil=g("sommeil")||8;p.prot=g("prot")||0;p.kcal=g("kcal")||0;p.objectif=g("objectif")||80});
  const f=document.querySelector(".sheet"), close=()=>f.parentElement.remove();
  $("lock")&&($("lock").onclick=()=>{oublierCode();try{localStorage.removeItem(LS_KEY)}catch(e){}S=structuredClone(DEFAULT);pinMsg="";offline=false;close();render();setSync("local","Code requis")});
  $("unlock")&&($("unlock").onclick=()=>{offline=false;close();render()});
  let arme=false;
  $("reset").onclick=()=>{if(!arme){arme=true;$("reset").textContent="Confirmer : tout effacer (séances, plats, historique)";return}S=structuredClone(SEED);save();render();close()};
}

function act(a,id){
  if(a==="tab"){tab=id;render();window.scrollTo(0,0);return}
  if(a==="mange"){const[d,i]=id.split("|");const j=fige(d);const r=j.repas[+i];if(r){r.mange=!r.mange;save();render();const p=platOf(r.plat);if(r.mange&&p)toast(`${p.nom} : +${num(p.prot)} g de protéines`)}return}
  if(a==="day")return daySheet(id,false);
  if(a==="dayType")return daySheet(+id,true);
  if(a==="move")return moveSheet(id);
  if(a==="go"){const[s,d]=id.split("|");return workout(s,d)}
  if(a==="wk"){wkOff+=+id;render();return}
  if(a==="modePlan"){modePlan=id;render();return}
  if(a==="modeSea"){modeSea=id;render();return}
  if(a==="filtre"){filtre=id;render();return}
  if(a==="newSeance")return seanceSheet(null);
  if(a==="editSeance")return seanceSheet(seanceOf(id));
  if(a==="poids"){const d=today(), cur=S.poids.find(p=>p.date===d);
    return sheet("Mon poids aujourd'hui",[{name:"kg",label:"Poids (kg)",type:"number",big:1,step:"0.1",value:cur?.kg??dernierPoids()?.kg??""}],
      v=>{if(!(v.kg>20&&v.kg<300))return "Entre ton poids en kg.";S.poids=S.poids.filter(p=>p.date!==d);S.poids.push({date:d,kg:Math.round(v.kg*10)/10});toast(`Poids noté : ${num(v.kg)} kg`)},
      cur?()=>{S.poids=S.poids.filter(p=>p.date!==d)}:null)}
  if(a==="newPlat"||a==="editPlat"){const p=a==="editPlat"?platOf(id):{type:filtre!=="tout"?filtre:"repas"};
    return sheet(p.id?"Modifier le plat":"Nouveau plat",[
      {name:"nom",label:"Nom",value:p.nom,ph:"Poulet, riz, brocoli"},
      {name:"type",label:"Moment",type:"seg",options:TYPES,value:p.type||"repas"},
      {type:"html",html:`<div class="row2"><label class="field"><span class="label">Protéines (g)</span><input name="prot" type="number" inputmode="decimal" step="any" min="0" value="${p.prot??""}"></label><label class="field"><span class="label">Calories (kcal)</span><input name="kcal" type="number" inputmode="numeric" min="0" value="${p.kcal??""}"></label></div>`}],
      v=>{const f=document.querySelector(".sheet");const prot=parseFloat(String(f.querySelector('[name="prot"]').value).replace(",","."))||0,kcal=parseFloat(f.querySelector('[name="kcal"]').value)||0;
        if(!v.nom)return "Donne un nom au plat.";Object.assign(p,{nom:v.nom,type:v.type||"repas",prot,kcal});if(!p.id){p.id=uid();S.plats.push(p)}},
      p.id?()=>{S.plats=S.plats.filter(x=>x.id!==p.id)}:null)}
  if(a==="placer"){const p=platOf(id);if(!p)return;const t=today();
    const opts=Object.fromEntries([0,1,2,3,4,5,6].map(i=>{const d=addD(t,i);return [d,shortDate(d)+(i>1?" "+parse(d).toLocaleDateString("fr-FR",{month:"short"}):"")]}));
    return sheet(`Placer ${esc(p.nom)}`,[{name:"j",label:"Jour",type:"select",options:opts,value:t},{name:"h",label:"Heure",type:"time",value:heureParDefaut(p.type)}],
      v=>{fige(v.j).repas.push({id:uid(),plat:p.id,heure:v.h||"12:30",mange:false});toast(`${p.nom} placé ${shortDate(v.j).toLowerCase()} à ${v.h||"12:30"}`)})}
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
$("sync").onclick=()=>{if(sb&&!code&&!offline)return;reglages()};
connect();
</script>
